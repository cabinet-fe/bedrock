name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - name: web check + build
        working-directory: web
        run: |
          bun install
          bun run check
          bun run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure embed dist exists
        run: |
          mkdir -p cmd/server/dist
          if [ ! -f cmd/server/dist/index.html ]; then
            printf '%s\n' '<!doctype html><html><head></head><body>ci placeholder</body></html>' > cmd/server/dist/index.html
          fi
      - name: Go test
        run: go test -count=1 -p 4 -timeout=15m ./...
      - name: Go build (embed)
        run: make build-backend

  smoke-sqlite:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure embed dist
        run: |
          mkdir -p cmd/server/dist
          if [ ! -f cmd/server/dist/index.html ]; then
            printf '%s\n' '<!doctype html><html><head></head><body>ci placeholder</body></html>' > cmd/server/dist/index.html
          fi
      - name: Fresh install + API smoke (SQLite)
        run: bash scripts/smoke/fresh-install.sh
