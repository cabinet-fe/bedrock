name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ensure embed dist exists
        run: |
          mkdir -p cmd/server/dist
          if [ ! -f cmd/server/dist/index.html ]; then
            printf '%s\n' '<!doctype html><html><head></head><body>ci placeholder</body></html>' > cmd/server/dist/index.html
          fi
      - name: Go test (shard ${{ matrix.shard }}/2)
        run: |
          PKGS="$(go list ./... | awk -v s='${{ matrix.shard }}' 'NR % 2 == s % 2')"
          echo "shard ${{ matrix.shard }}: $(echo "$PKGS" | wc -l) packages"
          go test -count=1 -p 4 -timeout=15m $PKGS

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Build web (FRONTEND_DIR=web)
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          bun install
          bun run check
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/dist

  # 编译不依赖测试结果，与 gate 并行提前跑；发布门禁由 publish 的 needs 保证
  binaries:
    needs: [frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: cmd/server/dist
      - name: Verify embedded frontend
        run: test -f cmd/server/dist/index.html
      - name: Build Server + Deploy Agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o bedrock-${{ matrix.suffix }} ./cmd/server
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o bedrock-agent-${{ matrix.suffix }} ./cmd/agent
          sha256sum bedrock-${{ matrix.suffix }} bedrock-agent-${{ matrix.suffix }} \
            > bedrock-${{ matrix.suffix }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bedrock-${{ matrix.suffix }}
          path: |
            bedrock-${{ matrix.suffix }}
            bedrock-agent-${{ matrix.suffix }}
            bedrock-${{ matrix.suffix }}.sha256

  publish:
    needs: [gate, binaries]
    # softprops/action-gh-release 必须基于 tag；workflow_dispatch 走分支 ref 时跳过发版
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: bedrock-*
          merge-multiple: true
      - name: Aggregate SHA256SUMS
        run: |
          sha256sum \
            bedrock-linux-amd64 \
            bedrock-agent-linux-amd64 \
            bedrock-linux-arm64 \
            bedrock-agent-linux-arm64 \
            bedrock-windows-amd64.exe \
            bedrock-agent-windows-amd64.exe \
            > SHA256SUMS
      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          {
            echo "## 变更"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' --no-merges --reverse
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              git log -20 --pretty=format:'- %s (%h)' --no-merges --reverse
            fi
          } > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3.0.1
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            bedrock-*
            SHA256SUMS
